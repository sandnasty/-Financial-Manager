name: Controlled Artifact Promotion

on:
  workflow_run:
    workflows:
      - Immutable Container Artifact
    types:
      - completed
  workflow_dispatch:
    inputs:
      publication_run_id:
        description: Successful Immutable Container Artifact run ID to promote
        required: false
        type: string
      promote_to_prod:
        description: Request promotion through the protected PROD environment
        required: true
        default: false
        type: boolean
      prod_confirmation:
        description: Type PROMOTE when requesting PROD promotion
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: controlled-promotion-${{ github.event.workflow_run.id || inputs.publication_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve-artifact:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      immutable_ref: ${{ steps.resolve.outputs.immutable_ref }}
      digest: ${{ steps.resolve.outputs.digest }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      project_version: ${{ steps.resolve.outputs.project_version }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout promotion controls from main
        uses: actions/checkout@v4

      - name: Select successful publication run
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            run_id='${{ github.event.workflow_run.id }}'
          else
            run_id='${{ inputs.publication_run_id }}'
          fi
          test -n "${run_id}"
          case "${run_id}" in
            *[!0-9]*) echo "publication run ID must be numeric" >&2; exit 2 ;;
          esac
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download immutable artifact metadata
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.publication.outputs.run_id }}
          pattern: immutable-container-metadata-*
          path: promotion-input
          merge-multiple: true

      - name: Resolve and validate immutable artifact identity
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(find promotion-input -type f -name artifact-metadata.json -print -quit)"
          test -n "${metadata}"
          python tools/promotion_record.py resolve \
            --metadata "${metadata}" \
            --repository "${GITHUB_REPOSITORY}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --expected-run-id '${{ steps.publication.outputs.run_id }}' \
            --github-output "${GITHUB_OUTPUT}" \
            --resolved-copy promotion-source/artifact-metadata.json

      - name: Log in to GHCR for read-only verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the digest-qualified source artifact exists
        shell: bash
        run: docker buildx imagetools inspect '${{ steps.resolve.outputs.immutable_ref }}'

      - name: Preserve promotion source metadata
        uses: actions/upload-artifact@v4
        with:
          name: promotion-source-${{ github.run_id }}
          path: promotion-source/artifact-metadata.json
          if-no-files-found: error
          retention-days: 90

  deploy-dev:
    needs: resolve-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: DEV
    permissions:
      contents: read
      actions: read
      packages: read

    steps:
      - name: Checkout promotion record tool
        uses: actions/checkout@v4

      - name: Download resolved promotion source
        uses: actions/download-artifact@v4
        with:
          name: promotion-source-${{ github.run_id }}
          path: promotion-source

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy exact digest to DEV runner
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          docker pull "${IMMUTABLE_REF}"
          docker run --detach --name fm-dev-${GITHUB_RUN_ID} \
            --publish 127.0.0.1:18080:8080 "${IMMUTABLE_REF}"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs fm-dev-${GITHUB_RUN_ID}
          exit 1

      - name: Stop DEV deployment
        if: always()
        run: docker rm --force fm-dev-${GITHUB_RUN_ID} >/dev/null 2>&1 || true

      - name: Record DEV deployment
        shell: bash
        run: |
          python tools/promotion_record.py record \
            --metadata promotion-source/artifact-metadata.json \
            --repository "${GITHUB_REPOSITORY}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --source-run-id '${{ needs.resolve-artifact.outputs.source_run_id }}' \
            --environment DEV \
            --deployment-mode digest-pinned-runner-healthcheck \
            --promotion-run-id "${GITHUB_RUN_ID}" \
            --promotion-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --actor "${GITHUB_ACTOR}" \
            --triggering-actor "${GITHUB_TRIGGERING_ACTOR}" \
            --approval-control automatic-after-successful-publication \
            --output deployment-record-DEV.json

      - name: Preserve DEV deployment record
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record-DEV-${{ github.run_id }}
          path: deployment-record-DEV.json
          if-no-files-found: error
          retention-days: 90

  deploy-test:
    needs:
      - resolve-artifact
      - deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: TEST
    permissions:
      contents: read
      actions: read
      packages: read

    steps:
      - name: Checkout promotion record tool
        uses: actions/checkout@v4

      - name: Download resolved promotion source
        uses: actions/download-artifact@v4
        with:
          name: promotion-source-${{ github.run_id }}
          path: promotion-source

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy the same exact digest to TEST runner
        shell: bash
        env:
          IMMUTABLE_REF: ${{ needs.resolve-artifact.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          docker pull "${IMMUTABLE_REF}"
          docker run --detach --name fm-test-${GITHUB_RUN_ID} \
            --publish 127.0.0.1:28080:8080 "${IMMUTABLE_REF}"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:28080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs fm-test-${GITHUB_RUN_ID}
          exit 1

      - name: Stop TEST deployment
        if: always()
        run: docker rm --force fm-test-${GITHUB_RUN_ID} >/dev/null 2>&1 || true

      - name: Record TEST deployment
        shell: bash
        run: |
          python tools/promotion_record.py record \
            --metadata promotion-source/artifact-metadata.json \
            --repository "${GITHUB_REPOSITORY}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --source-run-id '${{ needs.resolve-artifact.outputs.source_run_id }}' \
            --environment TEST \
            --deployment-mode digest-pinned-runner-healthcheck \
            --promotion-run-id "${GITHUB_RUN_ID}" \
            --promotion-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --actor "${GITHUB_ACTOR}" \
            --triggering-actor "${GITHUB_TRIGGERING_ACTOR}" \
            --approval-control automatic-after-successful-dev \
            --output deployment-record-TEST.json

      - name: Preserve TEST deployment record
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record-TEST-${{ github.run_id }}
          path: deployment-record-TEST.json
          if-no-files-found: error
          retention-days: 90

  promote-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_to_prod == true
    needs:
      - resolve-artifact
      - deploy-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: PROD
    permissions:
      contents: read
      actions: read
      packages: read

    steps:
      - name: Require explicit production confirmation
        shell: bash
        run: test '${{ inputs.prod_confirmation }}' = 'PROMOTE'

      - name: Checkout promotion record tool
        uses: actions/checkout@v4

      - name: Download resolved promotion source
        uses: actions/download-artifact@v4
        with:
          name: promotion-source-${{ github.run_id }}
          path: promotion-source

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact PROD promotion candidate without rebuilding
        shell: bash
        run: docker buildx imagetools inspect '${{ needs.resolve-artifact.outputs.immutable_ref }}'

      - name: Record approved PROD promotion baseline
        shell: bash
        run: |
          python tools/promotion_record.py record \
            --metadata promotion-source/artifact-metadata.json \
            --repository "${GITHUB_REPOSITORY}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --source-run-id '${{ needs.resolve-artifact.outputs.source_run_id }}' \
            --environment PROD \
            --deployment-mode approved-promotion-baseline-no-production-runtime \
            --promotion-run-id "${GITHUB_RUN_ID}" \
            --promotion-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --actor "${GITHUB_ACTOR}" \
            --triggering-actor "${GITHUB_TRIGGERING_ACTOR}" \
            --approval-control github-environment-required-reviewer \
            --output deployment-record-PROD.json

      - name: Preserve PROD promotion record
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record-PROD-${{ github.run_id }}
          path: deployment-record-PROD.json
          if-no-files-found: error
          retention-days: 90
