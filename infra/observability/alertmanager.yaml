route:
  receiver: high-critical-router
  group_by: [alertname, severity, owner]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  matchers:
    - severity=~"high|critical"

receivers:
  - name: high-critical-router
    webhook_configs:
      - url: http://alert-router:8081/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="high"
    equal: [alertname, service]
