name: PR Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository revision and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'

      - name: Verify GNU Make 4.3
        shell: bash
        run: |
          set -euo pipefail
          actual="$(make --version | awk 'NR==1 {print $3}')"
          echo "GNU Make version: ${actual}"
          test "${actual}" = "4.3"

      - name: Record pipeline identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-results
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "workflow=${GITHUB_WORKFLOW}"
          } | tee ci-evidence.txt

      - name: Run authoritative validation
        shell: bash
        run: |
          set -euo pipefail
          make validate

      - name: Install pinned Python SAST scanner
        shell: bash
        run: python -m pip install --disable-pip-version-check 'bandit==1.9.4'

      - name: Run Bandit SAST and retain JSON
        shell: bash
        run: |
          set +e
          bandit -r infra tools -f json -o security-results/bandit.json
          status=$?
          set -e
          if [ "${status}" -gt 1 ]; then
            echo "Bandit execution failed with exit ${status}" >&2
            exit "${status}"
          fi

      - name: Run Trivy dependency, secret, and configuration scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: security-results/trivy-source.json
          exit-code: '0'

      - name: Scan full repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git /repo --redact --report-format json \
            --report-path /repo/security-results/gitleaks.json --exit-code 0
          test -f security-results/gitleaks.json || printf '[]\n' > security-results/gitleaks.json

      - name: Enforce High and Critical security gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/security_gate.py \
            --exceptions security/security-exceptions.json \
            --bandit security-results/bandit.json \
            --trivy security-results/trivy-source.json \
            --trivy-scanner trivy-source \
            --gitleaks security-results/gitleaks.json \
            --summary security-results/security-gate-summary.json \
            --source-sha "${GITHUB_SHA}" \
            --build-run-id "${GITHUB_RUN_ID}"

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PR validation evidence"
            echo ""
            echo "- Commit SHA: \`${GITHUB_SHA}\`"
            echo "- Workflow run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Run attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- Authoritative command: \`make validate\`"
            echo "- Security gate: Bandit + Trivy + full-history Gitleaks"
            echo "- Blocking threshold: unexcepted High/Critical findings"
            echo "- Job result: \`${{ job.status }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload pipeline and security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-evidence-${{ github.run_id }}
          path: |
            ci-evidence.txt
            dist/baseline-service.zip
            security-results/
          if-no-files-found: warn
          retention-days: 90
