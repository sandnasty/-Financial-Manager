services:
  baseline:
    build:
      context: .
      dockerfile: infra/container/Dockerfile
    image: financial-manager/baseline:ms-59
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    restart: "no"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - fm_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  fm_internal:
    driver: bridge
    internal: true
